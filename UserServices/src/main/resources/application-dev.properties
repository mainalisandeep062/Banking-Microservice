# 1. Database Configuration
# Tip: Use lower-case for database names in URLs to avoid cross-OS issues
spring.datasource.url=jdbc:mysql://localhost:3306/user_service?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
# In Spring Boot 4, this driver is auto-detected, but keeping it is fine
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
# IMPORTANT: In Hibernate 6 (Spring Boot 4), you should use the base MySQLDialect.
# Hibernate now auto-detects your version (8.0, 9.0, etc.)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Eureka Registration
spring.application.name=user-service
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}

# 4. Security / JWT
# Note: Fixed the typo "SERCRET" to "SECRET"
app.jwt.secret=${SECRET_STRING:My_very_long_Secret_Key_That_is_at_least_32_characters_long_for_HS256}
app.jwt.expiration=86400000