spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/notification_service?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.retry.enabled=true
#JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

#Liquibase configuration
spring.liquibase.change-log=classpath:changelog/changelog-master.xml
spring.liquibase.enabled=true
spring.liquibase.contexts=dev

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

server.port=8084

jwt.secret=${SECRET_STRING:My_very_long_Secret_Key_That_is_at_least_32_characters_long_for_HS256}

# OpenAPI / Swagger (service)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.display-request-duration=true
openapi.service.title=Notification Service
openapi.service.version=1.0.0
openapi.service.description=Sends notifications and messages
