spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/account_service?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

server.port=8082

jwt.secret=${SECRET_STRING:My_very_long_Secret_Key_That_is_at_least_32_characters_long_for_HS256}