server.port=8080
# Tells Spring to use the Servlet (WebMVC) stack
spring.main.web-application-type=servlet
spring.cloud.gateway.server.webmvc.enabled=true

# JWT Secret (Must match User Service)
jwt.secret=${SECRET_STRING:My_very_long_Secret_Key_That_is_at_least_32_characters_long_for_HS256}

# Eureka Registry
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

# OpenAPI / Swagger (gateway)
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Swagger UI aggregation (gateway-proxied service docs)
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/api/user/v3/api-docs
springdoc.swagger-ui.urls[1].name=Account Service
springdoc.swagger-ui.urls[1].url=/api/account/v3/api-docs
springdoc.swagger-ui.urls[2].name=Transaction Service
springdoc.swagger-ui.urls[2].url=/api/transaction/v3/api-docs
springdoc.swagger-ui.urls[3].name=Notification Service
springdoc.swagger-ui.urls[3].url=/api/notification/v3/api-docs